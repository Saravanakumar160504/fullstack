<!DOCTYPE html>
<html ng-app="app">
<head>
<meta charset="UTF-8">
<title>Todo</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

<style>
body{font-family:Arial;background:linear-gradient(120deg,#89f7fe,#66a6ff);
display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;width:380px;padding:20px;border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,.2)}
h2{text-align:center}
input{width:65%;padding:6px;border-radius:15px;border:1px solid #ccc}
button{padding:6px 10px;border:none;border-radius:15px;cursor:pointer}
.add{background:#66a6ff;color:#fff}
.task{display:flex;justify-content:space-between;margin-top:8px;
padding:6px;background:#f5f5f5;border-radius:8px}
.done{text-decoration:line-through;color:gray}
.filters{text-align:center;margin-top:8px}
.filters button{margin:2px;background:#ddd}
</style>
</head>

<body ng-controller="ctrl">
<div class="box">
<h2>Todo List</h2>
<p>{{left()}} / {{tasks.length}} left</p>

<input ng-model="newTask" placeholder="New task">
<button class="add" ng-click="add()">Add</button>

<div class="filters">
<button ng-click="f=''">All</button>
<button ng-click="f={completed:false}">Pending</button>
<button ng-click="f={completed:true}">Completed</button>
</div>

<div class="task" ng-repeat="t in tasks | filter:f">
<div>
<input type="checkbox" ng-model="t.completed">
<span ng-class="{'done':t.completed}">{{t.name}}</span>
</div>
<button ng-click="del($index)">X</button>
</div>
</div>

<script>
angular.module("app",[])
.controller("ctrl",$scope=>{
$scope.tasks=[
{name:"Learn AngularJS",completed:false},
{name:"Build Todo App",completed:false}
];
$scope.add=()=>{$scope.newTask&&($scope.tasks.push({name:$scope.newTask,completed:false}),$scope.newTask="")};
$scope.del=i=>$scope.tasks.splice(i,1);
$scope.left=()=>$scope.tasks.filter(t=>!t.completed).length;
});
</script>
</body>
</html>
